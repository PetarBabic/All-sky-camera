<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aalto All-sky Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="currentImage">
        <a href="images/2026-09-11/full-sized/2034-05.jpg" id="full-sized_image">
            <img src="images/2026-09-11/medium/2034-05.jpg" id="medium_image">
        </a>
    </div>

    <div class="otherImages">
        <nav>
            <ul id="imageList">
            </ul>
        </nav>
    </div>

    <table>
        <tr>
            <td> <button class="calButton" id="decYear"> < </button> </td>
            <th colspan="5" id="year"></th>
            <td> <button class="calButton" id="incYear"> > </button> </td>
        </tr>
        
        <tr>
            <td> <button class="calButton" id="decMonth"> < </button> </td>
            <th colspan="5" id="month"></th>
            <td> <button class="calButton" id="incMonth"> > </button> </td>
        </tr>
        
        <tr id="weekDays">
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
            <th>Sun</th>
        </tr>

        <tr id="row1">
        </tr>

        <tr id="row2">
        </tr>

        <tr id="row3"">
        </tr>

        <tr id="row4">
        </tr>

        <tr id="row5">
        </tr>

        <tr id="row6">
        </tr>
    </table>
    
    <script src="script.js"></script>
</body>
</html>
