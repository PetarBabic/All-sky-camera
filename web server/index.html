<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aalto All-sky Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="currentImage">
        <a href="images/full-sized/2107-37.jpg" id="full-sized_image">
            <img src="images/medium/2107-37.jpg" id="medium_image">
        </a>
    </div>

    <div class="otherImages">
        <nav>
            <ul id="imageList">
            </ul>
        </nav>
    </div>

    <div class="calendar">
        <div class="month">
                <ul>
                    <li class="prev">&#10094;</li>
                    <li class="next">&#10095;</li>
                    <li id="currentMonth">
                    </li>
                </ul>
        </div>

        <div class="weekdays">
            <ul>
                <li>Mo</li>
                <li>Tu</li>
                <li>We</li>
                <li>Th</li>
                <li>Fr</li>
                <li>Sa</li>
                <li>Su</li>
            </ul>
        </div>
        
        <div class="days">
            <ul id="listOfDays">
                
            </ul>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
